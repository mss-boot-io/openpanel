name: OpenPanel Release

on:
  push:
    tags:
      - 'openpanel-v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: |
            core/go.sum
            agent/go.sum

      - name: Build OpenPanel artifact
        id: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -Eeuo pipefail
          release_version="${GITHUB_REF_NAME#openpanel-}"
          export VERSION="${release_version}"
          scripts/openpanel/build_artifact.sh 2>&1 | tee openpanel-build.log
          artifact="build/openpanel/openpanel-${release_version}-linux-${{ matrix.goarch }}.tar.gz"
          test -f "${artifact}"
          mkdir -p release
          cp "${artifact}" "release/openpanel-${release_version}-linux-${{ matrix.goarch }}.tar.gz"
          cp "${artifact}" "release/openpanel-linux-${{ matrix.goarch }}.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openpanel-linux-${{ matrix.goarch }}
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Prepare checksums
        run: |
          cp install.sh release/install.sh
          chmod +x release/install.sh
          cd release
          sha256sum *.tar.gz install.sh > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/install.sh
            release/checksums.txt
